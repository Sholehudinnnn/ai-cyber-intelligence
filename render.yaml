services:
  - type: web
    name: ai-cyber-intelligence
    runtime: python
    plan: free
    rootDir: 04_app_pipeline
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
